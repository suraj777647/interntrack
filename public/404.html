<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>InternTrack - Redirecting</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      var path = window.location.pathname;
      var repo = path.split('/')[1];
      window.location.replace('/' + (repo ? repo + '/' : '') + '#' + path.replace('/' + repo, ''));
    </script>
  </head>
  <body>
    <p>Redirecting to InternTrack...</p>
  </body>
</html>
